<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>手机回收报价 · 官方 WeUI v2.6.16 高保真原型</title>
<link rel="stylesheet" href="weui.min.css" />
<style>
  /* ===== Refined WeChat Native Design System (Impeccable Operate + WeUI v2.6.16) ===== */
  :root {
    --phone-width: 375px;
    --bg-canvas: #F5F6F7;
    --bg-surface: #FFFFFF;
    --bg-subtle: #F2F3F5;
    --bg-hover: #EBEDF0;
    --hairline: rgba(0, 0, 0, 0.06);
    --hairline-strong: rgba(0, 0, 0, 0.09);
    --ink-1: rgba(0, 0, 0, 0.90);
    --ink-2: rgba(0, 0, 0, 0.56);
    --ink-3: rgba(0, 0, 0, 0.36);
    --brand: #07C160;
    --brand-tint: rgba(7, 193, 96, 0.09);
    --brand-border: rgba(7, 193, 96, 0.42);
    --link: #576B95;
    --price-red: #FA5151;
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --r-card: 12px;
    --r-btn: 10px;
    --r-chip: 7px;
    --fs-hero: 44px;
    --fs-price: 20px;
    --fs-h1: 18px;
    --fs-nav: 17px;
    --fs-body: 15.5px;
    --fs-sub: 13.5px;
    --fs-cap: 12px;
  }
  html, body {
    margin: 0; padding: 0; background: #111827; color: #E5E7EB; min-height: 100vh;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .workspace {
    display: flex; justify-content: center; align-items: flex-start;
    gap: 28px; padding: 24px 20px 40px; max-width: 1220px; margin: 0 auto; flex-wrap: wrap;
  }
  .phone-stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .stage-caption { font-size: 12px; color: #9CA3AF; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .stage-badge { background: rgba(7,193,96,0.18); color: #4ADE80; padding: 2px 8px; border-radius: 999px; font-weight: 600; }

  .phone-shell {
    width: calc(var(--phone-width) + 20px); height: 832px;
    background: #1F2937; border-radius: 46px; padding: 10px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.12);
    transition: width 0.2s ease;
  }
  .phone-screen {
    width: var(--phone-width); height: 812px;
    background: var(--bg-canvas); color: var(--ink-1);
    border-radius: 36px; overflow: hidden;
    position: relative; transform: translateZ(0);
    display: flex; flex-direction: column;
    transition: width 0.2s ease;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    --weui-BG-0: var(--bg-canvas);
    --weui-BG-1: var(--bg-subtle);
    --weui-BG-2: var(--bg-surface);
    --weui-FG-0: var(--ink-1);
    --weui-FG-1: var(--ink-2);
    --weui-FG-2: var(--ink-3);
    --weui-FG-3: var(--hairline);
    caret-color: var(--brand);
  }
  .phone-screen ::selection { background: rgba(7, 193, 96, 0.16); color: var(--ink-1); }
  .phone-screen.large-font { font-size: 17.5px; }
  .phone-screen.large-font .weui-cell { font-size: 17.5px; }

  /* Native WeChat Status + NavBar */
  .wx-nav-wrap { background: var(--bg-surface); color: var(--ink-1); flex-shrink: 0; user-select: none; position: relative; z-index: 600; }
  .wx-nav-wrap.nav-white { background: var(--bg-surface); border-bottom: 0.5px solid var(--hairline); }
  .wx-statusbar {
    height: 44px; padding: 14px 22px 0;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .wx-navbar { height: 44px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; }
  .wx-nav-left { width: 88px; display: flex; align-items: center; }
  .wx-back-btn {
    display: inline-flex; align-items: center; min-width: 44px; min-height: 44px;
    background: none; border: none; color: var(--ink-1); cursor: pointer; padding: 4px;
    transition: opacity 0.12s ease;
  }
  .wx-back-btn:active { opacity: 0.5; }
  .wx-nav-title {
    font-size: var(--fs-nav); font-weight: 600; letter-spacing: -0.01em;
    text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wx-capsule {
    width: 87px; height: 32px; border-radius: 16px;
    background: rgba(255,255,255,0.85); border: 0.5px solid rgba(0,0,0,0.10);
    display: flex; align-items: center; justify-content: space-evenly; cursor: pointer; color: #000;
  }
  .wx-capsule-div { width: 0.5px; height: 15px; background: rgba(0,0,0,0.14); }

  .page-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; background: var(--bg-canvas); position: relative; }
  .page-body::-webkit-scrollbar, .brand-rail::-webkit-scrollbar, .quotes-right::-webkit-scrollbar { width: 3px; }
  .page-body::-webkit-scrollbar-thumb, .brand-rail::-webkit-scrollbar-thumb, .quotes-right::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 99px; }

  /* Unified Inset Card Architecture (Declares elevation once via crisp surface contrast, zero nested cards!) */
  .ui-card {
    margin: 10px 12px 0;
    background: var(--bg-surface);
    border-radius: var(--r-card);
    overflow: hidden;
  }
  .ui-card-hd {
    padding: 12px 14px 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .ui-card-title { font-size: 14px; font-weight: 600; color: var(--ink-1); letter-spacing: -0.01em; }
  .ui-card-action { font-size: 13px; color: var(--link); text-decoration: none; font-weight: 400; }
  .ui-card-action:active { opacity: 0.6; }
  .ui-section-hd {
    padding: 14px 16px 6px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  }

  /* Clean WeUI cell overrides inside inset cards (subtle inset hairlines, zero double borders) */
  .phone-screen .weui-cells { margin-top: 0; background: transparent; }
  .phone-screen .weui-cells::before, .phone-screen .weui-cells::after { display: none; }
  .phone-screen .weui-cell { padding: 12px 14px; background: var(--bg-surface); transition: background-color 0.12s ease; }
  .phone-screen .weui-cell:active { background: var(--bg-subtle); }
  .phone-screen .weui-cell::before { left: 14px; border-top-color: var(--hairline); }
  .phone-screen .weui-cell_access .weui-cell__ft { padding-right: 18px; }
  .phone-screen .weui-cell_access .weui-cell__ft::after { color: rgba(0, 0, 0, 0.24); }
  .phone-screen .weui-panel { margin-top: 10px; background: var(--bg-surface); }
  .phone-screen .weui-panel::before, .phone-screen .weui-panel::after { display: none; }
  .phone-screen .weui-cells__title {
    margin: 0; padding: 14px 16px 6px;
    font-size: 12.5px; font-weight: 500; color: var(--ink-2);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .phone-screen .weui-toptips { top: 96px; z-index: 6500; border-radius: 8px; left: 16px; right: 16px; width: auto; padding: 9px 14px; font-size: 13.5px; }
  .phone-screen .weui-toptips.toptips-ok { background: var(--brand); }
  .phone-screen .weui-toptips.toptips-info { background: rgba(17,24,39,0.88); }

  /* Native TabBar (Calm, refined hairline) */
  .wx-tabbar-shell { flex-shrink: 0; background: var(--bg-surface); border-top: 0.5px solid var(--hairline); padding-bottom: 14px; position: relative; }
  .wx-tabbar-shell::after {
    content: ""; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 4px; border-radius: 99px; background: rgba(0,0,0,0.18); z-index: 600;
  }
  .phone-screen .weui-tabbar { background: transparent; padding-top: 4px; }
  .phone-screen .weui-tabbar::before { display: none; }
  .phone-screen .weui-tabbar__icon {
    width: 22px; height: 22px; margin: 0 auto 2px;
    display: flex; align-items: center; justify-content: center; color: var(--ink-2);
  }
  .phone-screen .weui-tabbar__label { font-size: 10.5px; color: var(--ink-2); line-height: 1.3; }
  .phone-screen .weui-bar__item_on .weui-tabbar__icon,
  .phone-screen .weui-bar__item_on .weui-tabbar__label { color: var(--brand); font-weight: 600; }

  /* Unified Search Pill (Replaces clunky gray WeUI search bar outer chrome) */
  .search-top-bar {
    background: var(--bg-surface);
    padding: 8px 12px 10px;
    border-bottom: 0.5px solid var(--hairline);
    display: flex; align-items: center; gap: 10px;
  }
  .search-pill {
    flex: 1; height: 36px; padding: 0 12px;
    background: var(--bg-subtle); border-radius: 10px;
    display: flex; align-items: center; gap: 8px;
    color: var(--ink-3); font-size: 14px; box-sizing: border-box;
    cursor: pointer; transition: background-color 0.12s ease;
  }
  .search-pill:active { background: var(--bg-hover); }
  .search-pill input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--ink-1); line-height: 1.4; padding: 0;
  }
  .search-pill input::placeholder { color: var(--ink-3); }
  .search-clear-btn {
    width: 20px; height: 20px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.16); color: #FFF; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; padding: 0; line-height: 1;
  }
  .search-cancel-link { font-size: 15px; color: var(--link); text-decoration: none; flex-shrink: 0; padding: 4px 2px; }

  /* Unified Chip Vocabulary (Consistent across Search, Quotes Series, and Detail Spec/Warranty!) */
  .chip {
    display: inline-flex; align-items: center; justify-content: center; gap: 3px;
    min-height: 32px; padding: 5px 12px; border-radius: var(--r-chip);
    border: 1px solid transparent; background: var(--bg-subtle);
    color: var(--ink-1); font-size: 13.5px; font-weight: 500; line-height: 1.25;
    cursor: pointer; flex-shrink: 0; box-sizing: border-box;
    transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .chip:active { background: var(--bg-hover); }
  .chip.is-selected, .chip.active {
    color: var(--brand); background: var(--brand-tint);
    border-color: var(--brand-border); font-weight: 600;
  }
  .chip-sm { min-height: 28px; padding: 4px 10px; font-size: 12.5px; border-radius: 6px; }

  /* Distinct Series Dropdown Trigger (Unmistakable select affordance vs flat quick chips) */
  .series-dropdown-btn {
    display: inline-flex; align-items: center; gap: 5px;
    min-height: 28px; padding: 0 7px 0 9px; border-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.14); background: var(--bg-surface);
    color: var(--ink-1); font-size: 12.5px; font-weight: 500; line-height: 1;
    cursor: pointer; flex-shrink: 0; box-sizing: border-box;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .series-dropdown-btn:active { background: var(--bg-subtle); }
  .series-dropdown-btn.active {
    background: var(--brand-tint); border-color: var(--brand-border);
    color: var(--brand); font-weight: 600; box-shadow: none;
  }
  .series-dd-count {
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    padding: 1px 5px; border-radius: 4px;
    background: var(--bg-subtle); color: var(--ink-2); line-height: 1.25;
  }
  .series-dropdown-btn.active .series-dd-count {
    background: rgba(7, 193, 96, 0.14); color: var(--brand);
  }
  .series-dd-div { width: 0.5px; height: 11px; background: rgba(0, 0, 0, 0.12); flex-shrink: 0; }
  .series-dropdown-btn.active .series-dd-div { background: rgba(7, 193, 96, 0.28); }
  .series-dd-ico {
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-2); flex-shrink: 0;
  }
  .series-dropdown-btn.active .series-dd-ico { color: var(--brand); }

  /* Brand Logos (Soft squircle tiles, borderless modern feel) */
  .brand-logo-wrap {
    width: 40px; height: 40px; margin: 0 auto 6px;
    border-radius: 11px; background: var(--bg-canvas);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .brand-logo-img { width: 22px; height: 22px; object-fit: contain; display: block; }
  .brand-logo-sm { width: 20px; height: 20px; object-fit: contain; display: block; flex-shrink: 0; }
  .brand-logo-fallback {
    width: 20px; height: 20px; border-radius: 5px; background: var(--bg-subtle);
    color: var(--ink-1); font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  /* Home: Upstream Inviter Contact Strip (Shown ONLY to direct 1-level invitees when inviter set & enabled it) */
  .inviter-contact-card {
    margin: 10px 12px 0; padding: 10px 14px;
    background: var(--bg-surface); border-radius: var(--r-card);
    display: flex; align-items: center; gap: 10px;
  }
  .inviter-phone-ico {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: var(--brand-tint); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .inviter-contact-body { flex: 1; min-width: 0; cursor: pointer; }
  .inviter-contact-label { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; }
  .inviter-contact-num {
    font-size: 14.5px; font-weight: 600; color: var(--ink-1);
    font-variant-numeric: tabular-nums; line-height: 1.35; margin-top: 1px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .inviter-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .inviter-qr-btn {
    flex-shrink: 0; height: 30px; padding: 0 10px; border-radius: 7px; border: none;
    background: var(--bg-subtle); color: var(--ink-1);
    font-size: 12.5px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    transition: background-color 0.12s ease;
  }
  .inviter-qr-btn:active { background: var(--bg-hover); }
  .inviter-call-btn {
    flex-shrink: 0; height: 30px; padding: 0 11px; border-radius: 7px; border: none;
    background: var(--brand-tint); color: var(--brand);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color 0.12s ease;
  }
  .inviter-call-btn:active { background: rgba(7, 193, 96, 0.18); }

  /* Contact Phone & WeChat QR Dialog Form */
  .contact-field-label { font-size: 12.5px; font-weight: 600; color: var(--ink-1); margin: 12px 0 6px; }
  .contact-field-label:first-child { margin-top: 0; }
  .contact-input {
    width: 100%; height: 42px; padding: 0 12px; box-sizing: border-box;
    border-radius: 9px; border: 1px solid var(--hairline-strong);
    background: var(--bg-canvas); color: var(--ink-1);
    font-size: 15.5px; font-variant-numeric: tabular-nums; outline: none;
  }
  .contact-input:focus { border-color: var(--brand); background: var(--bg-surface); }
  .contact-qr-box {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 9px; background: var(--bg-canvas);
  }
  .contact-qr-thumb {
    width: 56px; height: 56px; border-radius: 8px; flex-shrink: 0;
    background: var(--bg-surface); border: 0.5px solid var(--hairline-strong);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .contact-qr-upload {
    width: 56px; height: 56px; border-radius: 8px; flex-shrink: 0;
    border: 1px dashed rgba(0, 0, 0, 0.22); background: var(--bg-surface);
    color: var(--ink-2); font-size: 22px; font-weight: 300;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .contact-switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 12px; padding: 10px 12px; border-radius: 9px; background: var(--bg-canvas);
    font-size: 13.5px; color: var(--ink-1); cursor: pointer;
  }
  .contact-switch-row input { width: 18px; height: 18px; accent-color: var(--brand); cursor: pointer; }

  /* Home: Clean Side-by-Side Category Tiles + Borderless 3x3 Brand Grid */
  .home-cat-row {
    margin: 10px 12px 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .home-cat-tile {
    background: var(--bg-surface); border-radius: var(--r-card);
    padding: 13px 14px; text-decoration: none; display: flex; flex-direction: column; gap: 8px;
    border: 1px solid transparent; transition: background-color 0.12s ease, border-color 0.12s ease;
  }
  .home-cat-tile:active { background: var(--bg-subtle); }
  .home-cat-tile.is-active { border-color: var(--brand-border); background: linear-gradient(180deg, rgba(7,193,96,0.05) 0%, #FFFFFF 100%); }
  .home-cat-top { display: flex; align-items: center; justify-content: space-between; }
  .home-cat-icon {
    width: 34px; height: 34px; border-radius: 9px; background: var(--bg-subtle);
    color: var(--ink-1); display: flex; align-items: center; justify-content: center;
  }
  .home-cat-tile.is-active .home-cat-icon { background: var(--brand-tint); color: var(--brand); }
  .home-cat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
  .home-cat-name { font-size: 15px; font-weight: 600; color: var(--ink-1); line-height: 1.3; }
  .home-cat-desc { font-size: 12px; color: var(--ink-2); line-height: 1.35; margin-top: 2px; }

  /* Compact 3-Col Digital Categories Row (Laptop / Camera / Tablet) */
  .home-digital-row {
    margin: 8px 12px 0;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .home-digital-tile {
    background: var(--bg-surface); border-radius: 11px;
    padding: 10px 8px; text-decoration: none;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    border: 1px solid transparent; transition: background-color 0.12s ease, border-color 0.12s ease;
  }
  .home-digital-tile:active { background: var(--bg-subtle); }
  .home-digital-tile.is-active { border-color: var(--brand-border); background: linear-gradient(180deg, rgba(7,193,96,0.05) 0%, #FFFFFF 100%); }
  .home-digital-ico {
    width: 30px; height: 30px; border-radius: 8px; background: var(--bg-subtle);
    color: var(--ink-1); display: flex; align-items: center; justify-content: center;
  }
  .home-digital-tile.is-active .home-digital-ico { background: var(--brand-tint); color: var(--brand); }
  .home-digital-name { font-size: 13px; font-weight: 600; color: var(--ink-1); line-height: 1.25; }
  .home-digital-sub { font-size: 10.5px; color: var(--ink-3); line-height: 1.2; }

  /* Segmented inline switcher (Home Brand Header) */
  .seg-pill {
    display: inline-flex; align-items: center; padding: 2px;
    background: var(--bg-subtle); border-radius: 7px; gap: 2px;
  }
  .seg-pill-btn {
    border: none; background: transparent; color: var(--ink-2);
    font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 5px;
    cursor: pointer; transition: all 0.12s ease; line-height: 1.3;
  }
  .seg-pill-btn.active { background: var(--bg-surface); color: var(--ink-1); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  /* Borderless 3-col Brand Grid */
  .brand-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 4px 8px 12px; gap: 4px;
  }
  .brand-grid-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 4px; border-radius: 10px; text-decoration: none;
    transition: background-color 0.12s ease;
  }
  .brand-grid-item:active { background: var(--bg-subtle); }
  .brand-grid-name { font-size: 13px; color: var(--ink-1); font-weight: 500; line-height: 1.3; }

  /* Quotes Flat Catalog (Clean split rail, zero box-in-box search clutter) */
  .quotes-root { display: flex; flex-direction: column; height: 100%; background: var(--bg-surface); }
  .quotes-tabs {
    display: flex; align-items: center; background: var(--bg-surface);
    border-bottom: 0.5px solid var(--hairline); flex-shrink: 0; padding: 0 4px;
    overflow-x: auto;
  }
  .quotes-tabs::-webkit-scrollbar { display: none; }
  .quotes-tab {
    flex: 1; min-width: max-content; text-align: center; padding: 10px 6px; font-size: 13.5px; font-weight: 500;
    color: var(--ink-2); cursor: pointer; position: relative; transition: color 0.12s ease; white-space: nowrap;
  }
  .quotes-tab.active { color: var(--ink-1); font-weight: 600; }
  .quotes-tab.active::after {
    content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 24px; height: 2.5px; border-radius: 99px; background: var(--brand);
  }
  .quotes-meta-strip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 14px; background: var(--bg-canvas); border-bottom: 0.5px solid var(--hairline);
    font-size: 11.5px; color: var(--ink-3); flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .quotes-split { display: flex; flex: 1; min-height: 0; }
  .brand-rail {
    width: 92px; background: var(--bg-canvas);
    overflow-y: auto; flex-shrink: 0; padding: 4px 0;
  }
  .brand-rail-item {
    width: 100%; min-height: 46px; padding: 10px 8px 10px 10px;
    border: none; background: transparent; box-sizing: border-box;
    font-size: 13.5px; color: var(--ink-2); cursor: pointer;

/* Parse a model's SKUs into explicit dimensions: capacity + optional warranty (在保/无保) */
function parseModelDimensions(m) {
  const skus = m[7];
  if (!skus.length || (skus.length === 1 && !skus[0][0])) {
    return { hasSpec: false, caps: [], warranties: [], skuMap: new Map([['', skus[0]]]) };
  }
  const caps = [];
  const warranties = [];
  const skuMap = new Map();
  for (const sku of skus) {
    const raw = sku[0];
    const parts = raw.split(' · ').map(x => x.trim()).filter(Boolean);
    let cap = raw, war = '';
    if (parts.length === 2 && (parts[1] === '在保' || parts[1] === '无保')) {
      cap = parts[0];
      war = parts[1];
    } else if (raw === '在保' || raw === '无保') {
      cap = '';
      war = raw;
    }
    if (cap && !caps.includes(cap)) caps.push(cap);
    if (war && !warranties.includes(war)) warranties.push(war);
    skuMap.set(`${cap}||${war}`, sku);
  }
  return { hasSpec: true, caps, warranties, skuMap };
}

function getAuthorizedBooks() {
  return RAW.priceBooks.filter(b => {
    if (b.visibility === 'internal') return false;
    if (b.visibility === 'public' && state.user.allowPublicBooks) return true;
    if (b.visibility === 'restricted' && state.user.loggedIn && state.user.grantedBookIds.includes(b.id)) return true;
    return false;
  });
}
function getActiveBook() {
  const books = getAuthorizedBooks();
  const found = books.find(b => b.id === state.user.preferredBookId);
  if (found) return found;
  const fallback = books[0] || null;
  state.user.preferredBookId = fallback ? fallback.id : '';
  return fallback;
}
function calcBookPrice(baseVal, book) {
  if (baseVal == null || !book) return null;
  const adj = book.factor === 1.0 ? baseVal : Math.max(10, Math.round((baseVal * book.factor) / 10) * 10);
  return adj + state.priceOffset;
}
function fmtMoney(n) { return '¥' + Number(n).toLocaleString('zh-CN'); }

}

/* Compute highest valid price for a model under active price book (Guji-style PriceMax in lists) */
function getModelMaxPriceInfo(m, book, preferredCap = '') {
  if (!book) return { state: 'none', amt: null };
  if (state.expired) return { state: 'expired', amt: null };
  let maxAmt = null;
  let hasPaused = false;
  let hasInquiry = false;
  const skus = m[7] || [];
  const filteredSkus = preferredCap
    ? skus.filter(s => s[0] === preferredCap || s[0].startsWith(preferredCap + ' · '))
    : skus;
  const targetSkus = filteredSkus.length ? filteredSkus : skus;
  for (const sku of targetSkus) {
    for (const [, baseVal, st] of (sku[1] || [])) {
      if (st === 0 && baseVal != null) {
        const val = calcBookPrice(baseVal, book);
        if (val != null && (maxAmt === null || val > maxAmt)) maxAmt = val;
      } else if (st === 2) {
        hasPaused = true;
      } else if (st === 3) {
        hasInquiry = true;
      }
    }
  }
  if (maxAmt !== null) return { state: 'normal', amt: maxAmt };
  if (hasPaused) return { state: 'paused', amt: null };
  if (hasInquiry) return { state: 'inquiry', amt: null };
  return { state: 'muted', amt: null };
}
function renderListMaxPriceHtml(m, preferredCap = '') {
  const book = getActiveBook();
  const info = getModelMaxPriceInfo(m, book, preferredCap);
  if (info.state === 'normal') {
    return `<span class="list-max-price"><span class="list-max-label">最高</span><span class="list-max-yen">¥</span><span class="list-max-num">${Number(info.amt).toLocaleString('zh-CN')}</span></span>`;
  }
  if (info.state === 'expired') return `<span class="state-tag state-tag_expired" style="font-size:11.5px;padding:2px 6px;">已过期</span>`;
  if (info.state === 'paused') return `<span class="state-tag state-tag_paused" style="font-size:11.5px;padding:2px 6px;">暂停回收</span>`;
  if (info.state === 'inquiry') return `<span class="state-tag state-tag_inquiry" style="font-size:11.5px;padding:2px 6px;">人工询价</span>`;
  return '';
}

let detailBannerIdx = 0;
let previewState = null;
function syncBannerIndicators(idx, total, imgs) {
  detailBannerIdx = idx;
  const countEl = document.getElementById('bannerCountPill');
  if (countEl) countEl.textContent = `${idx + 1} / ${total}`;

function onBannerScroll(el) {

  if (idx !== detailBannerIdx) syncBannerIndicators(idx, imgs.length, imgs);
}
function stepDetailBanner(delta) {
  const m = getModel(state.detailModelId);
  const imgs = getModelBannerImages(m);
  const next = (detailBannerIdx + delta + imgs.length) % imgs.length;
  const track = document.getElementById('detailBannerTrack');
  if (track) track.scrollTo({ left: next * track.clientWidth, behavior: 'smooth' });
  syncBannerIndicators(next, imgs.length, imgs);
}
function openBannerPreview(modelId, idx = 0) {
  const m = getModel(modelId);
  const imgs = getModelBannerImages(m);
  previewState = {
    modelId,
    idx: Math.max(0, Math.min(imgs.length - 1, idx)),
    imgs,
    name: m[4],
    scale: 1,
    tx: 0,
    ty: 0,
    dragging: false,
    moved: false,
    startX: 0,
    startY: 0,
    pinchStartDist: 0,
    pinchStartScale: 1,
  };
  renderBannerPreview();
}
function applyPreviewTransform() {
  const img = document.getElementById('bannerPreviewImg');
  const zval = document.getElementById('bannerZoomVal');
  if (!previewState) return;
  if (img) {
    img.style.transform = `translate3d(${previewState.tx}px, ${previewState.ty}px, 0) scale(${previewState.scale})`;
    img.classList.toggle('is-zoomed', previewState.scale > 1.02);
    img.classList.toggle('is-dragging', previewState.dragging);
  }
  if (zval) zval.textContent = `${Math.round(previewState.scale * 100)}%`;
}
function setBannerZoom(nextScale) {
  if (!previewState) return;
  const clamped = Math.max(1, Math.min(3.5, Math.round(nextScale * 10) / 10));
  previewState.scale = clamped;
  if (clamped <= 1.02) { previewState.tx = 0; previewState.ty = 0; }
  applyPreviewTransform();
}
function toggleBannerZoom() {
  if (!previewState) return;
  if (previewState.moved) { previewState.moved = false; return; }
  const next = previewState.scale < 1.8 ? 2 : previewState.scale < 2.8 ? 3 : 1;
  setBannerZoom(next);
}
function onPreviewPointerDown(e) {
  if (!previewState) return;
  if (e.touches && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    previewState.pinchStartDist = Math.hypot(dx, dy) || 1;
    previewState.pinchStartScale = previewState.scale;
    previewState.dragging = false;
    return;
  }
  if (previewState.scale <= 1.02) return;
  const pt = e.touches ? e.touches[0] : e;
  previewState.dragging = true;
  previewState.moved = false;
  previewState.startX = pt.clientX - previewState.tx;
  previewState.startY = pt.clientY - previewState.ty;
  applyPreviewTransform();
}
function onPreviewPointerMove(e) {
  if (!previewState) return;
  if (e.touches && e.touches.length === 2 && previewState.pinchStartDist) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    setBannerZoom(previewState.pinchStartScale * (dist / previewState.pinchStartDist));
    previewState.moved = true;
    return;
  }
  if (!previewState.dragging) return;
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  const nx = pt.clientX - previewState.startX;
  const ny = pt.clientY - previewState.startY;
  if (Math.abs(nx - previewState.tx) > 3 || Math.abs(ny - previewState.ty) > 3) previewState.moved = true;
  const limit = 160 * (previewState.scale - 1);
  previewState.tx = Math.max(-limit, Math.min(limit, nx));
  previewState.ty = Math.max(-limit, Math.min(limit, ny));
  applyPreviewTransform();
}
function onPreviewPointerUp() {

}
function stepBannerPreview(delta) {

  previewState.tx = 0;
  previewState.ty = 0;

}

function renderBannerPreview() {

      <div class="banner-lb-hd">

      </div>

        <img id="bannerPreviewImg" src="${cur.src}" alt="${esc(name)} ${esc(cur.label)}" draggable="false" onmousedown="onPreviewPointerDown(event)" ontouchstart="onPreviewPointerDown(event)" onclick="event.stopPropagation();toggleBannerZoom()" />
      </div>

      <div class="banner-lb-ft">

        <div class="banner-lb-zoom">

          <span class="banner-lb-zval" id="bannerZoomVal" title="点此还原" onclick="setBannerZoom(1)">${Math.round(scale * 100)}%</span>
          <button type="button" class="banner-lb-zbtn" aria-label="放大" onclick="setBannerZoom(previewState.scale + 0.5)">+</button>
        </div>
        <button type="button" class="banner-lb-btn" onclick="stepBannerPreview(1)">下一张</button>
      </div>
    </div>
  `;
  applyPreviewTransform();
}

function navigate(page, opts = {}) {
  saveCurrentScroll();
  closeHalfDialog();
  const tabPages = ['index', 'quotes', 'mine'];
  if (tabPages.includes(page)) {
    state.historyStack = [];
  } else if (state.page !== page) {
    state.historyStack.push(state.page);
  }
  state.page = page;
  if (opts.cat !== undefined) {
    saveLastCat(opts.cat);
    state.quotesCat = opts.cat;
    if (opts.brandIdx === undefined) state.quotesBrandIdx = -1;
    state.quotesSeries = '';
    state.inBrandFilter = '';
    state.quotesPageSize = 35;
    state.quotesRightScroll = 0;
  }
  if (opts.brandIdx !== undefined) {
    state.quotesBrandIdx = opts.brandIdx;
    state.quotesSeries = '';
    state.inBrandFilter = '';
    state.quotesPageSize = 35;
    state.quotesRightScroll = 0;
  }
  if (opts.modelId !== undefined) {
    state.detailModelId = opts.modelId;
    const m = getModel(opts.modelId);
    const dims = parseModelDimensions(m);
    if (dims.hasSpec) {
      const prefCap = (opts.cap && dims.caps.includes(opts.cap))
        ? opts.cap
        : (dims.caps.find(c => c.includes('256')) || dims.caps[0] || '');
      state.selectedCap = prefCap;
      if (dims.warranties.length) {
        if (opts.warranty && dims.skuMap.has(`${prefCap}||${opts.warranty}`)) {
          state.selectedWarranty = opts.warranty;
        } else if (dims.skuMap.has(`${prefCap}||无保`)) {
          state.selectedWarranty = '无保';
        } else {
          state.selectedWarranty = dims.warranties.find(w => dims.skuMap.has(`${prefCap}||${w}`)) || dims.warranties[0];
        }
      } else {
        state.selectedWarranty = '';
      }
    } else {
      state.selectedCap = '';
      state.selectedWarranty = '';
    }
    state.preMatchedNotice = opts.preMatchedNotice || '';
    state.specConfirmed = true;
    if (state.searchQuery.trim() && state.historyStack.at(-1) === 'search') {
      state.searchHistory = [state.searchQuery.trim(), ...state.searchHistory.filter(q => q !== state.searchQuery.trim())].slice(0, 8);
    }
    if (!opts.skipRecent) {
      state.recent = state.recent.filter(r => r.modelId !== opts.modelId);
      state.recent.unshift({ id: 'r_' + Date.now(), modelId: opts.modelId, cap: state.selectedCap, warranty: state.selectedWarranty, time: '刚刚' });
      state.recent = state.recent.slice(0, 15);
    }
  }
  if (opts.feedbackType) state.feedbackType = opts.feedbackType;
  if (opts.feedbackText !== undefined) state.feedbackText = opts.feedbackText;
  if (page === 'feedback') state.feedbackSubmitted = false;
  if (opts.focusSearch) state.shouldFocusSearch = true;
  render();
  document.getElementById('pageBody').scrollTop = 0;
}

function openAllSeriesDialog(brandName, seriesPairsJson) {
  const pairs = JSON.parse(seriesPairsJson);
  const totalModels = pairs.reduce((sum, [, c]) => sum + c, 0);
  const html = `<div class="weui-cells weui-cells_radio" style="margin-top:0;">
    ${[['', totalModels], ...pairs].map(([name, count]) => `
      <label class="weui-cell weui-check__label compact-cell">
        <div class="weui-cell__bd" style="display:flex;align-items:center;justify-content:space-between;padding-right:10px;">
          <span style="font-size:15px;font-weight:${state.quotesSeries === name ? '600' : '400'};color:${state.quotesSeries === name ? 'var(--brand)' : 'var(--ink-1)'};">${esc(name || '全部系列')}</span>
          <span style="font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;">${count} 款</span>
        </div>
        <div class="weui-cell__ft"><input type="radio" class="weui-check" name="series" ${state.quotesSeries === name ? 'checked' : ''} onchange="state.quotesSeries='${esc(name)}';state.quotesPageSize=35;state.quotesRightScroll=0;closeHalfDialog();render()" /><span class="weui-icon-checked"></span></div>
      </label>`).join('')}
  </div>`;
  openHalfDialog(`${brandName} · 切换系列`, html);
}

/* Page 2: Flat Quotes Catalog (Tab 2) */
function renderQuotes() {
  const canSwitch = getAuthorizedBooks().length >= 2;
  const catModels = RAW.models.filter(m => m[1] === state.quotesCat);

  const brandCounts = new Map();
  for (const m of catModels) brandCounts.set(m[2], (brandCounts.get(m[2]) || 0) + 1);
  const availBrandIndices = [];
  RAW.brands.forEach((_, idx) => { if (brandCounts.has(idx)) availBrandIndices.push(idx); });
  if (!brandCounts.has(state.quotesBrandIdx)) {
    state.quotesBrandIdx = availBrandIndices[0] ?? 0;
    state.quotesSeries = '';
    state.inBrandFilter = '';
  }

  const activeBrand = getBrandObj(state.quotesBrandIdx);
  const brandModels = catModels.filter(m => m[2] === state.quotesBrandIdx);

  const seriesMap = new Map();
  for (const m of brandModels) {
    const s = m[3] || '常规系列';
    if (!seriesMap.has(s)) seriesMap.set(s, []);
    seriesMap.get(s).push(m);
  }
  const APPLE_SERIES_ORDER = ['18系列', '17系列', '16系列', '15系列', '14系列', '13系列', '12系列', '11系列', 'X系列', 'SE系列', '8及以下', '点数系列'];
  const seriesArr = Array.from(seriesMap.entries()).sort((a, b) => {
    if (activeBrand.name === '苹果') {
      const ia = APPLE_SERIES_ORDER.indexOf(a[0]);
      const ib = APPLE_SERIES_ORDER.indexOf(b[0]);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    }
    return b[1].length - a[1].length;
  });
  if (state.quotesSeries && !seriesMap.has(state.quotesSeries)) state.quotesSeries = '';

  const kw = state.inBrandFilter.trim().toLowerCase();
  let list = state.quotesSeries ? (seriesMap.get(state.quotesSeries) || []) : brandModels;
  if (!kw && activeBrand.name === '苹果') {
    list = [...list].sort((a, b) => {
      const ia = APPLE_SERIES_ORDER.indexOf(a[3]);
      const ib = APPLE_SERIES_ORDER.indexOf(b[3]);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
  }
  if (kw) {
    list = searchAllModels(kw, state.quotesBrandIdx).map(x => x.m).filter(m => m[1] === state.quotesCat);
  }
  const sliced = list.slice(0, state.quotesPageSize);
  const hasMoreSeries = seriesArr.length > 3;
  const visibleSeries = hasMoreSeries ? seriesArr.slice(0, 2) : seriesArr;
  if (hasMoreSeries && state.quotesSeries && !visibleSeries.some(([s]) => s === state.quotesSeries)) {
    visibleSeries.unshift([state.quotesSeries, (seriesMap.get(state.quotesSeries) || []).length]);
  }
  window._openCurrentSeriesDialog = () => openAllSeriesDialog(activeBrand.name, JSON.stringify(seriesArr.map(([s, l]) => [s, l.length])));

  return `
    <div class="quotes-root">
      ${state.offline ? `<div class="offline-strip"><strong>历史报价</strong>（${RAW.snapshotDate} 09:00）· 断网模式</div>` : ''}

      <div class="quotes-tabs" role="tablist">
        ${[
          { id: 1, label: '环保机' },
          { id: 0, label: '靓机' },
          { id: 2, label: '笔记本' },
          { id: 3, label: '相机' },
          { id: 4, label: '平板' },
        ].map(c => `
          <div class="quotes-tab ${state.quotesCat === c.id ? 'active' : ''}" role="tab" onclick="saveLastCat(${c.id});state.quotesCat=${c.id};state.quotesSeries='';state.inBrandFilter='';state.quotesPageSize=35;state.quotesRightScroll=0;render()">${c.label}</div>
        `).join('')}
      </div>

      <div class="quotes-meta-strip">
        <span>共 ${catModels.length} 款机型</span>
        <span>更新 ${RAW.snapshotDate.slice(5)} 09:00</span>
      </div>

      <div class="quotes-split">
        <div class="brand-rail" id="brandRail" onscroll="state.brandRailScroll=this.scrollTop">
          ${availBrandIndices.map(bIdx => {
            const b = getBrandObj(bIdx);
            return `
              <button type="button" class="brand-rail-item ${state.quotesBrandIdx === bIdx ? 'active' : ''}" onclick="state.quotesBrandIdx=${bIdx};state.quotesSeries='';state.inBrandFilter='';state.quotesPageSize=35;state.quotesRightScroll=0;render()">
                ${renderBrandLogo(b, 'sm')}
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(b.name)}</span>
              </button>
            `;
          }).join('')}
        </div>

        <div class="quotes-right" id="quotesRightScroll" onscroll="state.quotesRightScroll=this.scrollTop">
          <div class="quotes-right-sticky">
            <div class="quotes-inbrand-bar">
              <div class="search-pill" style="height:34px;border-radius:8px;padding:0 10px;">
                ${SVG.search}
                <input type="text" inputmode="search" aria-label="品牌内搜索" id="inBrandInput" placeholder="搜索${esc(activeBrand.name)}机型" value="${esc(state.inBrandFilter)}" oncompositionstart="state.composing=true" oncompositionend="state.composing=false;state.inBrandFilter=this.value;state.quotesPageSize=35;keepInBrandFocus()" oninput="state.inBrandFilter=this.value;if(!state.composing){state.quotesPageSize=35;keepInBrandFocus()}" />
                ${state.inBrandFilter ? `<button type="button" class="search-clear-btn" aria-label="清空搜索" onclick="state.inBrandFilter='';keepInBrandFocus()">×</button>` : ''}
              </div>
            </div>
            ${(!kw && seriesArr.length > 1) ? `
              <div class="series-bar-inline">
                ${hasMoreSeries
                  ? `<button type="button" class="series-dropdown-btn ${state.quotesSeries === '' ? 'active' : ''}" aria-haspopup="listbox" onclick="window._openCurrentSeriesDialog()"><span>全部</span><span class="series-dd-count">${seriesArr.length}</span><span class="series-dd-div" aria-hidden="true"></span><span class="series-dd-ico" aria-hidden="true">${SVG.chevronDown}</span></button>`
                  : `<button type="button" class="chip chip-sm ${state.quotesSeries === '' ? 'active' : ''}" onclick="state.quotesSeries='';state.quotesPageSize=35;state.quotesRightScroll=0;render()">全部</button>`
                }
                ${visibleSeries.map(([sname]) => `
                  <button type="button" class="chip chip-sm ${state.quotesSeries === sname ? 'active' : ''}" onclick="state.quotesSeries='${esc(sname)}';state.quotesPageSize=35;state.quotesRightScroll=0;render()">${esc(sname.replace(/系列$/, ''))}</button>
                `).join('')}
              </div>
            ` : ''}
          </div>
          <div style="flex:1;">
            ${list.length ? `
              <div class="weui-cells" style="margin-top:0;">
                ${sliced.map(m => renderCompactModelRow(m)).join('')}
              </div>

/* Fault-tolerant model / alias / Model No. / spec search (with typo & Levenshtein tolerance) */
function fixCommonTypos(str) {
  return String(str).normalize('NFKC').toLowerCase()
    .replace(/\b(ipone|ipohne|iphne|iphoe|iphnoe|爱疯|挨疯)\b/g, 'iphone')
    .replace(/(ipone|ipohne|iphne|iphoe|iphnoe|爱疯)/g, 'iphone')
    .replace(/\b(huwei|hawuei|huawe|huwai)\b/g, 'huawei')
    .replace(/\b(xaiomi|xiaom|xiomi)\b/g, 'xiaomi')
    .replace(/\b(remdi|redim|redm)\b/g, 'redmi')
    .replace(/\b(honer|honro|hono)\b/g, 'honor')
    .replace(/\b(samsug|samung|samusng)\b/g, 'samsung')
    .replace(/\b(mata|mtae)\b/g, 'mate')
    .replace(/\b(fnid|fnd)\b/g, 'find')
    .replace(/\b(nvoa)\b/g, 'nova')
    .replace(/\b(ulrta|utra|ultar)\b/g, 'ultra')
    .replace(/\b(plsu|puls)\b/g, 'plus')
    .replace(/\b(promx|pormax|ptomax|pro\s*mxa|por\s*max|pto\s*max)\b/g, 'promax')
    .replace(/\b(por|pto)\b/g, 'pro')
    .replace(/\bmbp\b/g, 'macbook pro')
    .replace(/\bmba\b/g, 'macbook air')
    .replace(/(\d)\s*(pm|promx|pormax)\b/g, '$1 pro max')
    .replace(/(\d)\s*(por|pto)\b/g, '$1 pro');
}
function normalizeSearch(value) {
  return fixCommonTypos(value)
    .replace(/pro\s*max/g, 'promax')
    .replace(/[\s_—-]+/g, '');
}
function normalizeCodeKey(value) {
  return String(value).normalize('NFKC').toLowerCase().replace(/[\s_—-]+/g, '');
}
function normalizeCodeLookalike(value) {
  return normalizeCodeKey(value).replace(/o/g, '0').replace(/[il]/g, '1');
}
function editDistanceBounded(a, b, maxDist) {
  if (Math.abs(a.length - b.length) > maxDist) return maxDist + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      const val = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      cur.push(val);
      if (val < rowMin) rowMin = val;
    }
    if (rowMin > maxDist) return maxDist + 1;
    prev = cur;
  }
  return prev[b.length];
}
function splitSearchSpec(value) {
  let text = fixCommonTypos(value);
  // Also support space-separated RAM+Storage like "K80 12 256" -> "K80 12+256"
  text = text.replace(/(^|[^a-z0-9])(6|8|12|16|24)\s+(128|256|512|1024)(?:g(?:b)?)?(?=$|[^a-z0-9])/gi, '$1$2+$3');
  const match = text.match(/(^|[^a-z0-9])(\d{1,2}\s*\+\s*(?:64|128|256|512|1024|[12]\s*t(?:b)?)(?:g(?:b)?)?|(?:64|128|256|512|1024)(?:g(?:b)?)?|[12]\s*t(?:b)?)(?=$|[^a-z0-9])/i);
  let storage = '', ram = '';
  if (match) {
    const token = match[2].replace(/\s+/g, '').replace(/gb/g, 'g').replace(/tb/g, 't');
    const parts = token.split('+');
    if (parts.length === 2) ram = parts[0];
    storage = parts[parts.length - 1].replace(/g$/, '').replace(/^1024$/, '1t');
    text = text.slice(0, match.index) + match[1] + text.slice(match.index + match[0].length);
  }
  const tokens = text.replace(/[()（）]/g, ' ').split(/[\s_—-]+/).filter(Boolean).map(t => normalizeSearch(t));
  return { text: normalizeSearch(text).replace(/[()（）]/g, ''), storage, ram, tokens };
}
const BRAND_ALIASES = { '苹果':['iphone','apple','苹果'], '华为':['huawei','华为'], '荣耀':['honor','荣耀'],
  '红米':['redmi','红米'], '小米':['xiaomi','小米'], '三星':['samsung','三星'], '一加':['oneplus','一加'],
  '真我':['realme','真我'], '联想':['lenovo','联想'], '华硕':['asus','华硕'], '戴尔':['dell','戴尔'],
  '索尼':['sony','索尼'], '佳能':['canon','佳能'], '富士':['fujifilm','fuji','富士'], '大疆':['dji','大疆'], '尼康':['nikon','尼康'] };
function aliasesForBrand(index) {
  const name = getBrandObj(index).name;
  return (BRAND_ALIASES[name] || [name]).map(normalizeSearch);
}
function stripModelBrand(text, index) {
  let result = text;
  for (const alias of aliasesForBrand(index)) if (result.startsWith(alias)) result = result.slice(alias.length);
  return result;
}
const SEARCH_INDEX = RAW.models.map(m => ({
  m,
  name: stripModelBrand(splitSearchSpec(m[4]).text, m[2]),
  fullText: splitSearchSpec(m[4]).text,
  codes: m[5].map(normalizeCodeKey),
  codesLoose: m[5].map(normalizeCodeLookalike),
  caps: parseModelDimensions(m).caps.map(cap => ({ cap, ...splitSearchSpec(cap) })),
  embedded: splitSearchSpec(m[4]),
}));
function searchAllModels(rawQ, brandIdxFilter = -1) {
  const rawCodeKey = normalizeCodeKey(rawQ);
  const rawCodeLoose = normalizeCodeLookalike(rawQ);
  const looksLikeModelNo = /^[a-z0-9]{3,}$/.test(rawCodeKey) && /\d/.test(rawCodeKey);
  const query = splitSearchSpec(rawQ);
  if (!query.text && !query.storage && !looksLikeModelNo) return [];

  let brand = brandIdxFilter, name = query.text;
  let explicitBrandAlias = '';
  const explicit = RAW.brands.map((_, index) => ({ index, alias: aliasesForBrand(index).find(a => name.startsWith(a)) }))
    .filter(x => x.alias).sort((a,b) => b.alias.length - a.alias.length)[0];
  if (explicit) {
    if (brand >= 0 && brand !== explicit.index) return [];
    brand = explicit.index;
    explicitBrandAlias = explicit.alias;
    name = name.slice(explicit.alias.length);
  }
  const cleanTokens = query.tokens.filter(t => t && t !== explicitBrandAlias);
  const specMatches = spec => spec.storage === query.storage && (!query.ram || spec.ram === query.ram);
  const results = [];
  const fuzzyCandidates = [];

  for (const entry of SEARCH_INDEX) {
    const { m } = entry;
    if (brand >= 0 && m[2] !== brand) continue;

    // 1. Model No. matching (exact > lookalike/hyphen-free > partial code)
    let codeRank = 0, matchedCode = '';
    if (looksLikeModelNo && entry.codes.length) {
      const exactIdx = entry.codes.indexOf(rawCodeKey);
      if (exactIdx >= 0) {
        codeRank = 100; matchedCode = m[5][exactIdx];
      } else {
        const looseIdx = entry.codesLoose.indexOf(rawCodeLoose);
        if (looseIdx >= 0) {
          codeRank = 96; matchedCode = m[5][looseIdx];
        } else if (rawCodeKey.length >= 4 || (/[a-z]/.test(rawCodeKey) && rawCodeKey.length >= 3)) {
          const partIdx = entry.codesLoose.findIndex(c => c.length >= 4 && (c.includes(rawCodeLoose) || (rawCodeLoose.length >= 4 && rawCodeLoose.includes(c))));
          if (partIdx >= 0) {
            codeRank = 90; matchedCode = m[5][partIdx];
          }
        }
      }
    }

    // 2. Standard name matching
    let rank = codeRank || (name && entry.name === name ? 80 :
      name && entry.name.startsWith(name) && !(/^\d/.test(entry.name.slice(name.length)) && /\d$/.test(name)) ? 60 :
      name && entry.name.includes(name) ? 40 :
      !name && (brand >= 0 || query.storage) ? 20 : 0);

    // 3. Token-bag order-independent tolerance (e.g. "max 16 pro", "pro x8 find")
    let fuzzyReason = '';
    if (!rank && cleanTokens.length >= 2 && cleanTokens.every(t => entry.name.includes(t) || entry.fullText.includes(t))) {
      rank = 34;
      fuzzyReason = '智能容错';
    }

    let preCap = '', specRank = 0;
    if (query.storage) {
      const matches = entry.caps.filter(specMatches);
      if (matches.length) {
        specRank = 2;
        if (matches.length === 1 && (!matches[0].ram || query.ram === matches[0].ram)) preCap = matches[0].cap;
      } else if (entry.embedded.storage) {
        if (!specMatches(entry.embedded)) continue;
        specRank = 2;
      } else if (entry.caps.some(x => x.storage)) continue;
    }

    if (rank) {
      results.push({
        m, rank, specRank, preCap,
        reason: codeRank ? `Model No. ${matchedCode}` : (fuzzyReason || (specRank ? '规格匹配' : '型号匹配')),
      });
    } else if ((name && name.length >= 4) || (looksLikeModelNo && rawCodeKey.length >= 4)) {
      // Collect edit-distance fuzzy candidates in case direct match yields few/no results
      const maxD = (name || rawCodeKey).length >= 7 ? 2 : 1;
      let bestDist = maxD + 1;
      let codeNear = '';
      if (name && name.length >= 4 && entry.name.length >= 3) {
        const d = editDistanceBounded(name, entry.name, maxD);
        if (d < bestDist) bestDist = d;
      }
      if (looksLikeModelNo && entry.codesLoose.length) {
        for (let ci = 0; ci < entry.codesLoose.length; ci++) {
          const c = entry.codesLoose[ci];
          if (c.length < 4) continue;
          const d = editDistanceBounded(rawCodeLoose, c, 1);
          if (d < bestDist) { bestDist = d; codeNear = m[5][ci]; }
        }
      }
      if (bestDist <= maxD) {
        fuzzyCandidates.push({
          m, rank: 28 - bestDist * 4, specRank, preCap,
          reason: codeNear ? `相近 Model No. ${codeNear}` : '拼写容错',
        });
      }
    }
  }

  const finalList = results.length ? results : fuzzyCandidates;
  finalList.sort((a,b) => Number(b.rank >= 90) - Number(a.rank >= 90) || b.specRank - a.specRank || b.rank - a.rank ||
    Number(b.m[1] === state.lastCat) - Number(a.m[1] === state.lastCat) || a.m[4].localeCompare(b.m[4], 'zh-CN', { numeric:true }));
  return finalList;
}

function confirmSelectedSpec() {
  const dims = parseModelDimensions(getModel(state.detailModelId));
  state.specConfirmed = !dims.hasSpec || dims.skuMap.has(`${state.selectedCap}||${state.selectedWarranty}`);
  state.preMatchedNotice = '';
  render();
}

function selectCap(c) {
  const m = getModel(state.detailModelId);
  const dims = parseModelDimensions(m);
  state.selectedCap = c;
  if (dims.warranties.length && !dims.skuMap.has(`${c}||${state.selectedWarranty}`)) {
    state.selectedWarranty = dims.skuMap.has(`${c}||无保`)
      ? '无保'
      : (dims.warranties.find(w => dims.skuMap.has(`${c}||${w}`)) || dims.warranties[0]);
  }
  state.preMatchedNotice = '';
  state.specConfirmed = true;
  if (state.recent[0] && state.recent[0].modelId === m[0]) {
    state.recent[0].cap = state.selectedCap;
    state.recent[0].warranty = state.selectedWarranty;
  }
  render();
}
function selectWarranty(w) {
  const m = getModel(state.detailModelId);
  const dims = parseModelDimensions(m);
  state.selectedWarranty = w;
  if (dims.caps.length && !dims.skuMap.has(`${state.selectedCap}||${w}`)) {
    state.selectedCap = dims.caps.find(c => dims.skuMap.has(`${c}||${w}`)) || dims.caps[0];
  }
  state.preMatchedNotice = '';
  state.specConfirmed = true;
  if (state.recent[0] && state.recent[0].modelId === m[0]) {
    state.recent[0].cap = state.selectedCap;
    state.recent[0].warranty = state.selectedWarranty;
  }
  render();
}

    state.shouldFocusSearch = false;
    setTimeout(() => {
      const el = document.getElementById('searchInput');
      if (el) el.focus();
    }, 30);
  }
  renderConsole();
}

if (typeof location !== 'undefined' && typeof document !== 'undefined' && document.body && /[?&]debug=1(?:&|$)/.test(location.search || '')) {
  document.body.classList.add('show-debug');
}
render();
</script>
</body>
